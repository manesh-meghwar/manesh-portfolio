<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects | Manesh Kumar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css?v=10" rel="stylesheet">
  <style>
    .portfolio-pagination .page-link{background:#111a1a;border-color:rgba(193,255,229,.14);color:#94a3a2;min-width:42px;text-align:center}
    .portfolio-pagination .page-link:hover,.portfolio-pagination .page-item.active .page-link{background:#70f5c1;border-color:#70f5c1;color:#071010}
    .portfolio-pagination .page-item.disabled .page-link{background:#0b1414;border-color:rgba(193,255,229,.08);color:#4f6260}
    #project-list > [class*="col-"]{align-self:flex-start}
    .project-link{display:inline-flex;align-items:center;gap:.45rem;margin-top:1rem;color:#70f5c1;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-decoration:none;text-transform:uppercase}
    .project-link:hover{color:#fff}
    .project-link.is-empty{opacity:.45;pointer-events:none}
  </style>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <div id="site-nav"></div>
  <main class="container page-space">
    <header class="page-intro"><span>02</span><div><p class="eyebrow">Selected work</p><h1>Projects</h1><p>A growing collection of production web systems, API-based platforms, and early computer-vision work.</p></div></header>
    <div class="row g-4 align-items-start" id="project-list"></div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js?v=6"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("project-list");

      /* Always use the original two-letter project identifiers. */
      container.querySelectorAll(".project-card").forEach(function (card) {
        const title = card.querySelector(".project-body h2");
        const visual = card.querySelector(".project-visual");
        if (!title || !visual) return;
        visual.innerHTML = "<b>" + title.textContent.trim().slice(0, 2).toUpperCase() + "</b>";
      });

      const projectImages = [
        "assets/projects/bookwise.png",
        "assets/projects/olympics.png",
        "assets/projects/birdme.png",
        "assets/projects/the-darzee.jpg",
        "assets/projects/mycart.jpg",
        "assets/projects/objexyz.png",
        "assets/projects/preontech.png",
        "assets/projects/property-management.jpg",
        "assets/projects/mywater-atm.jpg",
        "assets/projects/number-plate-recognition.jpg",
        "assets/projects/learning-management.jpg"
      ];

      container.querySelectorAll(".project-body").forEach(function (projectBody, index) {
        if (!projectImages[index]) return;
        projectBody.style.backgroundImage =
          'linear-gradient(90deg, rgba(7,16,16,.76), rgba(7,16,16,.48)), url("' +
          projectImages[index] +
          '")';
        projectBody.style.backgroundSize = "cover";
        projectBody.style.backgroundPosition = "center";
        projectBody.style.backgroundRepeat = "no-repeat";
      });

      const itemsPerPage = 6;
      const items = Array.from(container.children);
      const totalPages = Math.ceil(items.length / itemsPerPage);
      if (totalPages <= 1) return;

      let currentPage = 1;
      const nav = document.createElement("nav");
      nav.className = "portfolio-pagination mt-5";
      nav.setAttribute("aria-label", "Projects pagination");
      container.insertAdjacentElement("afterend", nav);

      function showPage(page, shouldScroll) {
        currentPage = page;
        items.forEach(function (item, index) {
          const visible = index >= (page - 1) * itemsPerPage && index < page * itemsPerPage;
          item.classList.toggle("d-none", !visible);
        });

        nav.innerHTML = '<ul class="pagination justify-content-center flex-wrap gap-1">' +
          '<li class="page-item ' + (page === 1 ? "disabled" : "") + '"><button class="page-link" data-page="' + (page - 1) + '">Previous</button></li>' +
          Array.from({ length: totalPages }, function (_, index) {
            const number = index + 1;
            return '<li class="page-item ' + (number === page ? "active" : "") + '"><button class="page-link" data-page="' + number + '">' + number + '</button></li>';
          }).join("") +
          '<li class="page-item ' + (page === totalPages ? "disabled" : "") + '"><button class="page-link" data-page="' + (page + 1) + '">Next</button></li></ul>';

        if (shouldScroll) container.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      nav.addEventListener("click", function (event) {
        const button = event.target.closest("[data-page]");
        if (!button) return;
        const page = Number(button.dataset.page);
        if (page >= 1 && page <= totalPages && page !== currentPage) showPage(page, true);
      });

      showPage(1, false);
    });
  </script>
</body>
</html>
